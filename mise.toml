[tasks.build]
description = "Build the CLI"
run = "cargo build"
# `mise run b`
alias = "b"

[tasks.test]
description = "Run automated tests"
run = "cargo nextest run --workspace"
# run in user's cwd, default is the project's base directory
dir = "{{cwd}}"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Lint with clippy --all-targets"
env = { RUST_BACKTRACE = "1" }  # env vars for the script
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.ci]
description = "Run the full CI checklist locally: fmt, clippy, test"
depends = ["fmt", "clippy", "test", "dra-ci-resource-health", "dra-test-matrix", "dra-test-profile-config"]

[tasks.release-preflight]
description = "Run CI and preview the next patch release without changing Git or crates.io"
depends = ["ci"]
run = "cargo release patch --workspace --exclude k8s-device-plugin-example --no-confirm"

[tasks.dra-ci-resource-health]
description = "Lint and test the opt-in DRA resource-health feature and examples"
run = [
    "cargo clippy --locked -p k8s-device-plugin-dra --all-targets --features resource-health -- -D warnings",
    "cargo test --locked -p k8s-device-plugin-dra --all-targets --features resource-health",
]

[tasks.dra-test-matrix]
description = "Test local DRA matrix orchestration and failure recovery without VMs"
run = "python3 dra/hack/test-validate-k8s-versions.py"

[tasks.dra-test-profile-config]
description = "Test isolated DRA profile configuration without VMs"
run = "python3 dra/hack/test-configure-advanced-profile.py"

[tasks.dra-validate-k8s]
description = "Serially validate the DRA fixture on local Kubernetes v1.36.1 and v1.37.0"
run = "dra/hack/validate-k8s-versions.sh"

[tasks.proto-check-no-protoc]
description = "Check all protocol features without invoking external protoc"
run = "proto/hack/check-without-protoc.sh"

[tasks.lint]
description = "Lint with clippy"
env = { RUST_BACKTRACE = "1" }  # env vars for the script
# you can specify a multiline script instead of individual commands
run = '''
#!/usr/bin/env bash
cargo clippy
'''

[tasks.deps]
description = "Update dependencies"
run = ["cargo update", 'jj commit -m "Update deps" Cargo.lock']
