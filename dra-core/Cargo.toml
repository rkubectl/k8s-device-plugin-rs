[package]
name = "k8s-device-plugin-dra-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core contracts for Kubernetes DRA drivers"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
cargo-args = ["--config", 'env.K8S_OPENAPI_ENABLED_VERSION="1.37"']

[dependencies]
async-trait.workspace = true
k8s-device-plugin-core.workspace = true
k8s-quantity = { workspace = true, features = ["k8s-openapi"] }
k8s-openapi.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
