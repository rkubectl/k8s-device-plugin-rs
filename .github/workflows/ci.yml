name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--all-features"]
        schema: ["1.36", "1.37"]
    env:
      K8S_OPENAPI_ENABLED_VERSION: ${{ matrix.schema }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets ${{ matrix.features }} -- -D warnings

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--all-features"]
        schema: ["1.36", "1.37"]
    env:
      K8S_OPENAPI_ENABLED_VERSION: ${{ matrix.schema }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets ${{ matrix.features }}
      - run: cargo test --locked --workspace --doc ${{ matrix.features }}

  proto:
    name: Protocol generation without protoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: proto/hack/check-without-protoc.sh

  dra-matrix:
    name: DRA validation tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 dra/hack/test-validate-k8s-versions.py
      - run: python3 dra/hack/test-configure-advanced-profile.py

  consumer-schemas:
    name: Consumer-selected Kubernetes schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sh core/hack/check-consumer-features.sh
      - run: sh dra/hack/check-consumer-schemas.sh

  docker:
    name: Docker build (example)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: example/Dockerfile
          - dockerfile: dra/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
