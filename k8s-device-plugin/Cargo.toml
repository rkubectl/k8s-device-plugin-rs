[package]
name = "k8s-device-plugin"
description = "Unified Rust entrypoint for Kubernetes device-plugin and DRA runtimes"
readme = "README.md"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true


[package.metadata.docs.rs]
all-features = true
cargo-args = ["--config", 'env.K8S_OPENAPI_ENABLED_VERSION="1.37"']


[package.metadata.release]
pre-release-replacements = [
    { file = "README.md", search = 'version = "[0-9]+\.[0-9]+\.[0-9]+(?:-[^"]+)?"', replace = 'version = "{{version}}"', exactly = 2 },
    { file = "../docs/getting-started.md", search = 'version = "[0-9]+\.[0-9]+\.[0-9]+(?:-[^"]+)?"', replace = 'version = "{{version}}"', exactly = 2 },
]


[dependencies]
k8s-device-plugin-core.workspace = true
k8s-device-plugin-dra-core = { workspace = true, optional = true }
k8s-device-plugin-dra = { workspace = true, optional = true }
k8s-device-plugin-lib = { workspace = true, optional = true }
k8s-device-plugin-proto = { workspace = true, optional = true }


[features]
default = ["device-plugin", "dra", "proto"]
device-plugin = ["dep:k8s-device-plugin-lib"]
dra = ["dep:k8s-device-plugin-dra", "dep:k8s-device-plugin-dra-core"]
proto = ["dep:k8s-device-plugin-proto"]


[lints]
workspace = true
