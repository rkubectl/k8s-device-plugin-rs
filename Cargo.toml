[workspace]
resolver = "3"
members = ["core", "dra", "example", "k8s-device-plugin", "lib", "proto", "test"]


[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/rkubectl/k8s-device-plugin-rs"
license = "Apache-2.0"


[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
http = "1.4"
http-body-util = "0.1"
hyper-util = "0.1"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = "4.0"
prometheus_exporter = "0.8"
prost = "0.14"
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-test = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

k8s-device-plugin = { path = "k8s-device-plugin", version = "0.0.5" }
k8s-device-plugin-core = { path = "core", version = "0.0.5" }
k8s-device-plugin-dra = { path = "dra", version = "0.0.5" }
k8s-device-plugin-lib = { path = "lib", version = "0.0.5" }
k8s-device-plugin-proto = { path = "proto", version = "0.0.5" }
k8s-device-plugin-test = { path = "test", version = "0.0.5" }


[workspace.lints.clippy]
large_futures = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
redundant_type_annotations = "warn"
unused_async = "warn"
use_self = "warn"


[workspace.lints.rust]
deprecated_in_future = "warn"
future_incompatible = "warn"
# unreachable_pub = "warn"
missing_debug_implementations = "warn"
# non_exhaustive_omitted_patterns = "warn"
noop_method_call = "warn"
rust_2018_compatibility = "warn"
rust_2018_idioms = "warn"
rust_2021_compatibility = "warn"
rust_2024_compatibility = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused = "warn"
# unused_crate_dependencies = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
# warnings = "deny"


[patch.crates-io]
# kubelet's grpc-go Unix-socket client sends a percent-encoded socket path as
# :authority. Upstream h2 rejects it before Tonic can dispatch the gRPC call.
# Keep the fork revision pinned until upstream h2 or kubelet resolves this.
h2 = { git = "https://github.com/rkubectl/h2", rev = "852915ba20501b2a0d39bd54ab4521cde8ee54c9" }
