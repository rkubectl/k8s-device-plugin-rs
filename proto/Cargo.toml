[package]
name = "k8s-device-plugin-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated Kubernetes device-plugin and DRA protocol bindings for Rust"
readme = "README.md"
include = [
    "src/**",
    "tests/**",
    "build.rs",
    "README.md",
    "kubelet/LICENSE",
    "kubelet/pkg/apis/deviceplugin/v1beta1/api.proto",
    "kubelet/pkg/apis/dra/v1/api.proto",
    "kubelet/pkg/apis/pluginregistration/v1/api.proto",
    "kubelet/pkg/apis/dra-health/v1alpha1/api.proto",
]


[features]
dra = []
dra-health = ["dra"]


[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true


[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

# [lints]
# workspace = true

# Enforce API construction, ownership and synchronization policies without
# opting generated code into the other workspace lints.
[lints.clippy]
disallowed_methods = "warn"
disallowed_types = "warn"
redundant_clone = "warn"
