[package]
name = "k8s-device-plugin-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated Kubernetes device-plugin and DRA protocol bindings for Rust"
readme = "README.md"
exclude = ["hack/"]


[features]
dra = []
dra-health = ["dra"]


[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true


[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

# [lints]
# workspace = true

# Enforce the synchronization policy without changing the generated code's
# existing lint scope.
[lints.clippy]
disallowed_types = "warn"
