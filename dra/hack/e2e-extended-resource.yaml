# Kubernetes v1.37 extended-resource allocation fixture. Unlike e2e-smoke.yaml,
# this Pod does not name a ResourceClaim: the scheduler creates the DRA claim
# from the DeviceClass mapping and the container resource request.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dra-example-widget-extended
spec:
  extendedResourceName: dra.example.com/widget
  selectors:
    - cel:
        expression: device.driver == "dra.example.com"
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-example-extended-resource-consumer
  namespace: k8s-device-plugin-dra-example
spec:
  restartPolicy: Never
  containers:
    - name: consumer
      image: busybox:1.37
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -ec
        - |
          test "$DRA_E2E_DEVICE" = "widget-0"
          echo "DRA_E2E_DEVICE=$DRA_E2E_DEVICE"
          sleep 3600
      resources:
        limits:
          dra.example.com/widget: 1
